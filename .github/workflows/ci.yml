name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peng
          POSTGRES_PASSWORD: peng
          POSTGRES_DB: peng_opa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peng" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://peng:peng@localhost:5432/peng_opa_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile   # postinstall fetches and verifies the OPA binary
      - run: pnpm --filter @peng/shared build
      - run: pnpm --filter server exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e

  web-e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peng
          POSTGRES_PASSWORD: peng
          POSTGRES_DB: peng_opa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peng" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://peng:peng@localhost:5432/peng_opa
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      OPA_TOKEN: ci-opa-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web

  # After both test jobs pass on main, deploy that exact commit to Railway.
  # Setup (one time): docs/DEPLOY.md, "Deploy from GitHub Actions".
  deploy:
    runs-on: ubuntu-latest
    needs: [test, web-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: railway-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy settings
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::Add the RAILWAY_TOKEN secret (see docs/DEPLOY.md)"; exit 1; }
          test -n "$RAILWAY_SERVICE" || { echo "::error::Add the RAILWAY_SERVICE variable (see docs/DEPLOY.md)"; exit 1; }
      - name: Deploy to Railway
        # --ci streams the build log and fails the job if the build fails.
        run: npx --yes @railway/cli@5.71.0 up --ci --service "$RAILWAY_SERVICE"
      - name: Wait for /health
        if: env.APP_URL != ''
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "$APP_URL/health" || true)
            echo "$body"
            echo "$body" | grep -q '"db":"ok"' && echo "$body" | grep -q '"opa":"ok"' && exit 0
            sleep 10
          done
          echo "::error::$APP_URL/health did not report db and opa ok within 5 minutes"
          exit 1
